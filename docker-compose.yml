version: '3.8'

services:
  splicetrail-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: splicetrail:latest
    container_name: splicetrail-api
    # Container needs 0.0.0.0; the host side only listens on loopback so the
    # API can't be reached from outside except through nginx.
    command: ["python", "-m", "splicetrail", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Persistent storage for the index (SPLICETRAIL_INDEX_DIR=/data)
      - splicetrail-data:/data
      # Optional: mount local images directory
      # - ./images:/images:ro
    environment:
      # SpliceTrail Configuration
      - SPLICETRAIL_PATCH_SIZE=5
      - SPLICETRAIL_MAX_NFA=1.0
      - SPLICETRAIL_MAX_TARGETS=1000
      - SPLICETRAIL_PYRAMID_ENABLED=false
      - SPLICETRAIL_INDEX_DIR=/data
      # Require an X-API-Key header on every endpoint but /health/live and
      # /health/ready. Set it in the shell or an .env file next to this one.
      - SPLICETRAIL_API_KEY=${SPLICETRAIL_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: splicetrail-nginx
    ports:
      - "80:80"
      # For HTTPS, enable the 443 server block in nginx.conf and add:
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # For HTTPS, mount certificates:
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - splicetrail-api
    restart: unless-stopped
    profiles:
      - with-nginx

volumes:
  splicetrail-data:
    driver: local

networks:
  default:
    name: splicetrail-network
